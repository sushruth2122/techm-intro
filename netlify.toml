[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+.
  NODE_VERSION = "22"

# Fingerprinted build assets can be cached forever; the page itself always revalidates.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
